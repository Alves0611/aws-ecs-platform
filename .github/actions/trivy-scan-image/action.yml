name: "Trivy Image Scanner"
description: "Scan Docker image for vulnerabilities using Trivy"

inputs:
  image:
    description: "Docker image to scan (format: registry/repo:tag)"
    required: true
  severity:
    description: "Severity levels to scan (comma-separated)"
    required: false
    default: "CRITICAL,HIGH"
  fail-on-severity:
    description: "Fail workflow if vulnerabilities of this severity are found"
    required: false
    default: "CRITICAL"
  format:
    description: "Output format (table, json, sarif)"
    required: false
    default: "table"
  aws-region:
    description: "AWS region"
    required: false
    default: "us-east-1"
  aws-role-arn:
    description: "AWS IAM role ARN to assume"
    required: true
  artifact-name:
    description: "Unique name for the artifact (defaults to trivy-scan-report)"
    required: false
    default: "trivy-scan-report"
  app-name:
    description: "Application name for display in summary (e.g., Python API, React, Java API)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Run Trivy vulnerability scanner
      id: trivy-scan
      uses: aquasecurity/trivy-action@0.28.0
      env:
        TRIVY_DISABLE_VEX_NOTICE: "true"
      with:
        scan-type: "image"
        scan-ref: ${{ inputs.image }}
        format: json
        output: "trivy-report.json"
        severity: ${{ inputs.severity }}
        exit-code: "0"
      continue-on-error: true

    - name: Run Trivy for table format
      if: always()
      uses: aquasecurity/trivy-action@0.28.0
      env:
        TRIVY_DISABLE_VEX_NOTICE: "true"
      with:
        scan-type: "image"
        scan-ref: ${{ inputs.image }}
        format: table
        output: "trivy-report.table"
        severity: ${{ inputs.severity }}
        exit-code: "0"
      continue-on-error: true

    - name: Generate summary report
      id: summary
      shell: bash
      run: |
        APP_NAME="${{ inputs.app-name }}"
        if [ -z "$APP_NAME" ]; then
          # Extract app name from image if not provided
          IMAGE_NAME="${{ inputs.image }}"
          REPO_NAME=$(echo "$IMAGE_NAME" | sed 's|.*/||' | cut -d: -f1 | cut -d@ -f1)
          # Convert repo name to display name (e.g., python-api -> Python API)
          APP_NAME=$(echo "$REPO_NAME" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')
        fi

        echo "## 🔍 Trivy Security Scan - $APP_NAME" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "trivy-report.json" ]; then
          # Extract vulnerability counts
          CRITICAL=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-report.json 2>/dev/null || echo "0")
          HIGH=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-report.json 2>/dev/null || echo "0")
          MEDIUM=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-report.json 2>/dev/null || echo "0")
          TOTAL=$((CRITICAL + HIGH + MEDIUM))
          
          echo "### 📊 $APP_NAME Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$CRITICAL" -eq 0 ] && [ "$HIGH" -eq 0 ]; then
            echo "### ✅ Status: **PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Status: **ATTENTION REQUIRED**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
        fi

    - name: Upload scan report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ inputs.artifact-name }}
        path: trivy-report.*
        retention-days: 7
        if-no-files-found: ignore
