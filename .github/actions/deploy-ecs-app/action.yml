name: "Deploy ECS App"
description: "Build Docker image, push to ECR, and deploy to ECS"

inputs:
  app-name:
    description: "Application name (e.g., python-api, react, java-api)"
    required: true
  ecr-repository:
    description: "ECR repository name"
    required: true
  task-definition:
    description: "ECS task definition name"
    required: true
  service-name:
    description: "ECS service name"
    required: true
  container-name:
    description: "Container name in task definition"
    required: true
  aws-region:
    description: "AWS region"
    required: false
    default: "us-east-1"
  ecs-cluster:
    description: "ECS cluster name"
    required: false
    default: "ecs-cluster"
  aws-role-arn:
    description: "AWS IAM role ARN to assume"
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/${{ inputs.app-name }}
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}
        cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:buildcache
        cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:buildcache,mode=max

    - name: Set image outputs
      id: image-outputs
      shell: bash
      run: |
        IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}"
        # Extract digest from build-image output (format: sha256:abc123...)
        DIGEST="${{ steps.build-image.outputs.digest }}"
        # Create image URI with digest for immutable reference
        if [ -n "$DIGEST" ]; then
          IMAGE_URI_WITH_DIGEST="${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}@${DIGEST}"
        else
          IMAGE_URI_WITH_DIGEST="$IMAGE_URI"
        fi
        echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
        echo "image-with-digest=$IMAGE_URI_WITH_DIGEST" >> $GITHUB_OUTPUT
        echo "digest=$DIGEST" >> $GITHUB_OUTPUT

    - name: Download task definition
      shell: bash
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ inputs.task-definition }} \
          --query taskDefinition > task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ inputs.container-name }}
        image: ${{ steps.image-outputs.outputs.image-with-digest }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ inputs.service-name }}
        cluster: ${{ inputs.ecs-cluster }}
        wait-for-service-stability: true
