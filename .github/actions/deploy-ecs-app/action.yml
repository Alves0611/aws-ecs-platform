name: "Deploy ECS App"
description: "Deploy Docker image to ECS service"

inputs:
  app-name:
    description: "Application name (e.g., python-api, react, java-api)"
    required: true
  ecr-repository:
    description: "ECR repository name"
    required: true
  task-definition:
    description: "ECS task definition name"
    required: true
  service-name:
    description: "ECS service name"
    required: true
  container-name:
    description: "Container name in task definition"
    required: true
  aws-region:
    description: "AWS region"
    required: false
    default: "us-east-1"
  ecs-cluster:
    description: "ECS cluster name"
    required: false
    default: "ecs-cluster"
  aws-role-arn:
    description: "AWS IAM role ARN to assume"
    required: true
  image-uri:
    description: "Full Docker image URI (registry/repo:tag or registry/repo@digest)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Get image digest
      id: image-info
      shell: bash
      run: |
        IMAGE_URI="${{ inputs.image-uri }}"
        # If image URI includes digest, use it; otherwise use tag
        if [[ "$IMAGE_URI" == *"@sha256:"* ]]; then
          IMAGE_URI_WITH_DIGEST="$IMAGE_URI"
        else
          # Try to get digest from ECR
          REPO_NAME=$(echo "$IMAGE_URI" | sed 's|.*/||' | cut -d: -f1)
          TAG=$(echo "$IMAGE_URI" | sed 's|.*:||')
          DIGEST=$(aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
          if [ -n "$DIGEST" ]; then
            IMAGE_URI_WITH_DIGEST="${IMAGE_URI%%:*}:${IMAGE_URI##*/}@${DIGEST}"
          else
            IMAGE_URI_WITH_DIGEST="$IMAGE_URI"
          fi
        fi
        echo "image-with-digest=$IMAGE_URI_WITH_DIGEST" >> $GITHUB_OUTPUT

    - name: Download task definition
      shell: bash
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ inputs.task-definition }} \
          --query taskDefinition > task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ inputs.container-name }}
        image: ${{ steps.image-info.outputs.image-with-digest }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ inputs.service-name }}
        cluster: ${{ inputs.ecs-cluster }}
        wait-for-service-stability: true
