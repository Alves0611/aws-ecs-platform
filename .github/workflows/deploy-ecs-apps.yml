name: Build and Deploy ECS Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/python-api/**"
      - "apps/react/**"
      - "apps/java-api/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Application to deploy (python-api, react, java-api, or all)"
        required: true
        type: choice
        options:
          - python-api
          - react
          - java-api
          - all

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: ecs-cluster

permissions:
  id-token: write
  contents: read

jobs:
  set-vars:
    name: Set Variables - Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      python-api: ${{ steps.set-outputs.outputs.python-api }}
      react: ${{ steps.set-outputs.outputs.react }}
      java-api: ${{ steps.set-outputs.outputs.java-api }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes in files
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v2
        with:
          filters: |
            python-api:
              - 'apps/python-api/**'
            react:
              - 'apps/react/**'
            java-api:
              - 'apps/java-api/**'

      - name: Set outputs based on event type
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger - use input selection
            SELECTED_APP="${{ github.event.inputs.app }}"
            echo "Selected app: $SELECTED_APP"
            
            if [ "$SELECTED_APP" == "python-api" ]; then
              echo "python-api=true" >> $GITHUB_OUTPUT
              echo "react=false" >> $GITHUB_OUTPUT
              echo "java-api=false" >> $GITHUB_OUTPUT
            elif [ "$SELECTED_APP" == "react" ]; then
              echo "python-api=false" >> $GITHUB_OUTPUT
              echo "react=true" >> $GITHUB_OUTPUT
              echo "java-api=false" >> $GITHUB_OUTPUT
            elif [ "$SELECTED_APP" == "java-api" ]; then
              echo "python-api=false" >> $GITHUB_OUTPUT
              echo "react=false" >> $GITHUB_OUTPUT
              echo "java-api=true" >> $GITHUB_OUTPUT
            elif [ "$SELECTED_APP" == "all" ]; then
              echo "python-api=true" >> $GITHUB_OUTPUT
              echo "react=true" >> $GITHUB_OUTPUT
              echo "java-api=true" >> $GITHUB_OUTPUT
            else
              echo "python-api=false" >> $GITHUB_OUTPUT
              echo "react=false" >> $GITHUB_OUTPUT
              echo "java-api=false" >> $GITHUB_OUTPUT
            fi
          else
            # Push event - use path filter results (defaults to false if filter didn't run)
            PYTHON_CHANGED="${{ steps.filter.outputs.python-api }}"
            REACT_CHANGED="${{ steps.filter.outputs.react }}"
            JAVA_CHANGED="${{ steps.filter.outputs.java-api }}"
            
            # Normalize to true/false string
            if [ "$PYTHON_CHANGED" == "true" ]; then
              echo "python-api=true" >> $GITHUB_OUTPUT
            else
              echo "python-api=false" >> $GITHUB_OUTPUT
            fi
            
            if [ "$REACT_CHANGED" == "true" ]; then
              echo "react=true" >> $GITHUB_OUTPUT
            else
              echo "react=false" >> $GITHUB_OUTPUT
            fi
            
            if [ "$JAVA_CHANGED" == "true" ]; then
              echo "java-api=true" >> $GITHUB_OUTPUT
            else
              echo "java-api=false" >> $GITHUB_OUTPUT
            fi
          fi

  deploy-python-api:
    name: Build and Deploy Python API
    runs-on: ubuntu-latest
    needs: set-vars
    if: needs.set-vars.outputs.python-api == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/python-api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/python-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/python-api:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/python-api:buildcache,mode=max

      - name: Trivy Security Scan
        uses: ./.github/actions/trivy-scan-image
        continue-on-error: true
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/python-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          fail-on-severity: CRITICAL
          aws-region: ${{ env.AWS_REGION }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

      - name: Get image URI with digest
        id: image-uri
        shell: bash
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/python-api:${{ github.sha }}"
          DIGEST="${{ steps.build-image.outputs.digest }}"
          if [ -n "$DIGEST" ]; then
            IMAGE_URI_WITH_DIGEST="${{ steps.login-ecr.outputs.registry }}/python-api@${DIGEST}"
          else
            IMAGE_URI_WITH_DIGEST="$IMAGE_URI"
          fi
          echo "image-uri=$IMAGE_URI_WITH_DIGEST" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        uses: ./.github/actions/deploy-ecs-app
        with:
          app-name: python-api
          ecr-repository: python-api
          task-definition: task-python-api
          service-name: python-api-service
          container-name: python-api
          image-uri: ${{ steps.image-uri.outputs.image-uri }}
          aws-region: ${{ env.AWS_REGION }}
          ecs-cluster: ${{ env.ECS_CLUSTER }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-react:
    name: Build and Deploy React
    runs-on: ubuntu-latest
    needs: set-vars
    if: needs.set-vars.outputs.react == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/react
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/react:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/react:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/react:buildcache,mode=max

      - name: Trivy Security Scan
        uses: ./.github/actions/trivy-scan-image
        continue-on-error: true
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/react:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          fail-on-severity: CRITICAL
          aws-region: ${{ env.AWS_REGION }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

      - name: Get image URI with digest
        id: image-uri
        shell: bash
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/react:${{ github.sha }}"
          DIGEST="${{ steps.build-image.outputs.digest }}"
          if [ -n "$DIGEST" ]; then
            IMAGE_URI_WITH_DIGEST="${{ steps.login-ecr.outputs.registry }}/react@${DIGEST}"
          else
            IMAGE_URI_WITH_DIGEST="$IMAGE_URI"
          fi
          echo "image-uri=$IMAGE_URI_WITH_DIGEST" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        uses: ./.github/actions/deploy-ecs-app
        with:
          app-name: react
          ecr-repository: react
          task-definition: task-react
          service-name: react-service
          container-name: react
          image-uri: ${{ steps.image-uri.outputs.image-uri }}
          aws-region: ${{ env.AWS_REGION }}
          ecs-cluster: ${{ env.ECS_CLUSTER }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-java-api:
    name: Build and Deploy Java API
    runs-on: ubuntu-latest
    needs: set-vars
    if: needs.set-vars.outputs.java-api == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/java-api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/java-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/java-api:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/java-api:buildcache,mode=max

      - name: Trivy Security Scan
        uses: ./.github/actions/trivy-scan-image
        continue-on-error: true
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/java-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          fail-on-severity: CRITICAL
          aws-region: ${{ env.AWS_REGION }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

      - name: Get image URI with digest
        id: image-uri
        shell: bash
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/java-api:${{ github.sha }}"
          DIGEST="${{ steps.build-image.outputs.digest }}"
          if [ -n "$DIGEST" ]; then
            IMAGE_URI_WITH_DIGEST="${{ steps.login-ecr.outputs.registry }}/java-api@${DIGEST}"
          else
            IMAGE_URI_WITH_DIGEST="$IMAGE_URI"
          fi
          echo "image-uri=$IMAGE_URI_WITH_DIGEST" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        uses: ./.github/actions/deploy-ecs-app
        with:
          app-name: java-api
          ecr-repository: java-api
          task-definition: task-java-api
          service-name: java-api-service
          container-name: java-api
          image-uri: ${{ steps.image-uri.outputs.image-uri }}
          aws-region: ${{ env.AWS_REGION }}
          ecs-cluster: ${{ env.ECS_CLUSTER }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
