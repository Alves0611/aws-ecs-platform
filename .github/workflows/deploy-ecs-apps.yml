name: Build and Deploy ECS Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/python-api/**"
      - "apps/react/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Application to deploy (python-api, react, or all)"
        required: true
        type: choice
        options:
          - python-api
          - react
          - all

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: ecs-cluster

permissions:
  id-token: write
  contents: read

jobs:
  set-vars:
    name: Set Variables - Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      python-api: ${{ steps.set-outputs.outputs.python-api }}
      react: ${{ steps.set-outputs.outputs.react }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes in files
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v2
        with:
          filters: |
            python-api:
              - 'apps/python-api/**'
            react:
              - 'apps/react/**'

      - name: Set outputs based on event type
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger - use input selection
            SELECTED_APP="${{ github.event.inputs.app }}"
            echo "Selected app: $SELECTED_APP"
            
            if [ "$SELECTED_APP" == "python-api" ]; then
              echo "python-api=true" >> $GITHUB_OUTPUT
              echo "react=false" >> $GITHUB_OUTPUT
            elif [ "$SELECTED_APP" == "react" ]; then
              echo "python-api=false" >> $GITHUB_OUTPUT
              echo "react=true" >> $GITHUB_OUTPUT
            elif [ "$SELECTED_APP" == "all" ]; then
              echo "python-api=true" >> $GITHUB_OUTPUT
              echo "react=true" >> $GITHUB_OUTPUT
            else
              echo "python-api=false" >> $GITHUB_OUTPUT
              echo "react=false" >> $GITHUB_OUTPUT
            fi
          else
            # Push event - use path filter results (defaults to false if filter didn't run)
            PYTHON_CHANGED="${{ steps.filter.outputs.python-api }}"
            REACT_CHANGED="${{ steps.filter.outputs.react }}"
            
            # Normalize to true/false string
            if [ "$PYTHON_CHANGED" == "true" ]; then
              echo "python-api=true" >> $GITHUB_OUTPUT
            else
              echo "python-api=false" >> $GITHUB_OUTPUT
            fi
            
            if [ "$REACT_CHANGED" == "true" ]; then
              echo "react=true" >> $GITHUB_OUTPUT
            else
              echo "react=false" >> $GITHUB_OUTPUT
            fi
          fi

  deploy-python-api:
    name: Build and Deploy Python API
    runs-on: ubuntu-latest
    needs: set-vars
    if: needs.set-vars.outputs.python-api == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd apps/python-api
          docker build --platform linux/amd64 -t $ECR_REGISTRY/python-api:$IMAGE_TAG .
          docker push $ECR_REGISTRY/python-api:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/python-api:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition task-python-api \
            --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: python-api
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: python-api-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-react:
    name: Build and Deploy React
    runs-on: ubuntu-latest
    needs: set-vars
    if: needs.set-vars.outputs.react == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd apps/react
          docker build --platform linux/amd64 -t $ECR_REGISTRY/react:$IMAGE_TAG .
          docker push $ECR_REGISTRY/react:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/react:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition task-react \
            --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: react
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: react-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
